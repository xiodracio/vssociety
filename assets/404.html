<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — VARONIS</title>
<meta name="description" content="Only 200,000 memberships will ever exist. Membership begins with an invitation.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VARONIS">
<meta property="og:title" content="VARONIS — India’s First Secret Society">
<meta property="og:description" content="Only 200,000 memberships will ever exist. Membership begins with an invitation.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--surface:#151518;--surface2:#1b1b1f;--line:#34353a;--text:#f0f1f4;--mute:#a9adb5;--dim:#7d8088;--accent:#dfe3ea;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:#151518;--surface2:#1b1b1f;--line:#34353a;--text:#f0f1f4;--mute:#a9adb5;--dim:#7d8088;--accent:#dfe3ea}}
:root[data-theme="dark"]{--bg:#000;--surface:#151518;--surface2:#1b1b1f;--line:#34353a;--text:#f0f1f4;--mute:#a9adb5;--dim:#7d8088;--accent:#dfe3ea}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.chrome{mix-blend-mode:screen}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-weight:500}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1;letter-spacing:.02em}
h2{font-size:clamp(32px,5.5vw,52px);margin-top:14px}
.lead{color:var(--mute);max-width:560px;margin-top:18px;font-size:17px}
section{padding:96px 0;border-top:1px solid #121214}
.center{text-align:center}.center .lead{margin-inline:auto}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #17171a}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:34px;width:auto}
.brand span{font-size:12px;letter-spacing:.34em;font-weight:600}
nav{display:flex;gap:28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
nav a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border:1px solid var(--line);border-radius:999px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;transition:.25s;background:transparent;color:var(--text)}
.btn:hover{border-color:var(--accent);background:rgba(255,255,255,.04)}
.btn.solid{background:var(--accent);color:#0a0a0b;border-color:var(--accent)}
.btn.solid:hover{background:#fff}
.btn.sm{padding:10px 18px;font-size:11px}
/* hero */
.hero{min-height:calc(100vh - 64px);display:flex;align-items:center;padding:60px 0 80px;border:0;background:radial-gradient(ellipse 60% 50% at 50% 38%,rgba(150,160,178,.12),transparent 70%)}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.hero .mark{height:min(46vh,440px);width:auto}
.hero .word{width:min(560px,78vw);margin-top:26px}
.hero .tag{margin-top:34px;font-family:var(--serif);font-style:italic;font-size:clamp(20px,3vw,26px);color:var(--mute)}
.hero .cap{margin-top:14px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:38px}
/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:44px;max-width:640px;margin-inline:auto}
.cd div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 8px}
.cd b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(34px,7vw,56px);line-height:1}
.cd small{display:block;margin-top:10px;font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
.facts{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:30px;color:var(--mute);font-size:14px}
.facts span b{color:var(--text);font-weight:600}
/* invitation */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.cardx{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 26px}
.cardx h3{font-size:24px;margin-bottom:8px}
.cardx p{color:var(--mute);font-size:15px}
.num{font-size:11px;letter-spacing:.3em;color:var(--dim);margin-bottom:18px;display:block}
.big{font-family:var(--serif);font-size:clamp(70px,16vw,150px);line-height:1;background:linear-gradient(180deg,#fff 10%,#9ea3ad 70%,#5f636b);-webkit-background-clip:text;background-clip:text;color:transparent}
/* entry */
.steps{margin-top:44px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.step{display:flex;gap:22px;align-items:center;padding:24px 28px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step i{font-style:normal;font-family:var(--serif);font-size:30px;color:var(--dim);width:34px}
.step span{font-size:17px}
.note{margin-top:22px;color:var(--dim);font-size:14px}
/* admission */
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.ids{margin-top:30px;display:grid;gap:14px}
.ids div{padding-left:18px;border-left:1px solid var(--line);color:var(--mute);font-size:15px}
.ids b{display:block;color:var(--text);font-weight:600;font-size:14px;letter-spacing:.06em;margin-bottom:2px}
.dcard{aspect-ratio:1.586;border-radius:22px;border:1px solid #6c7079;background:linear-gradient(115deg,#0b0b0d 0%,#1c1d21 38%,#0b0b0d 62%,#111114 100%);padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);max-width:440px;margin-inline:auto;width:100%}
.dcard .w{width:34%}
.dcard .m{position:absolute;right:7%;top:20%;height:62%;width:auto}
.dcard .l{position:absolute;left:26px;bottom:24px}
.dcard .l strong{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(20px,3.6vw,28px);letter-spacing:.22em}
.dcard .l em{font-style:normal;font-size:10px;letter-spacing:.36em;color:var(--mute)}
.dcard .t{position:absolute;right:26px;top:26px;font-size:8px;letter-spacing:.3em;color:var(--dim)}
/* inside */
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:44px}
.grid2 div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 22px;color:var(--mute);font-size:15px}
.grid2 b{display:block;font-family:var(--serif);color:var(--text);font-weight:500;font-size:22px;margin-bottom:6px}
/* ranks */
.ranks{margin-top:44px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.rk{display:grid;grid-template-columns:54px 190px 1fr;gap:12px;align-items:center;padding:18px 26px;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk i{font-style:normal;font-size:11px;letter-spacing:.2em;color:var(--dim)}
.rk b{font-size:13px;letter-spacing:.18em;font-weight:600}
.rk span{color:var(--mute);font-size:14px}
.rk.cl span{font-style:italic}
/* final */
.final{text-align:center;padding:120px 0;background:radial-gradient(ellipse 50% 60% at 50% 50%,rgba(150,160,178,.1),transparent 70%)}
.final .mark{height:120px;width:auto;margin:0 auto 28px}
footer{border-top:1px solid #121214;padding:34px 0 44px;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
@media (max-width:820px){nav{display:none}.three,.grid2{grid-template-columns:1fr}.split{grid-template-columns:1fr;gap:40px}section{padding:72px 0}.rk{grid-template-columns:40px 1fr;row-gap:2px}.rk span{grid-column:2}.step{padding:20px}.cd{gap:8px}}
</style>
<style>.nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;gap:18px}.nf h1{font-size:clamp(48px,12vw,96px)}.nf p{color:var(--mute)}</style>
</head>
<body><main class="nf"><span class="eyebrow">Error 404</span><h1>Lost in the dark.</h1><p>This page doesn’t exist.</p><a class="btn" href="./">Return to VARONIS</a></main></body></html>
