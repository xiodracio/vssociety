<style>
:root{--bg:#000;--surface:#151518;--line:#34353a;--text:#f0f1f4;--mute:#a9adb5;--dim:#7d8088;--accent:#dfe3ea;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
.chrome{mix-blend-mode:screen}
.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-weight:500}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1;letter-spacing:.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #17171a}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:34px;width:auto}
.brand span{font-size:12px;letter-spacing:.34em;font-weight:600}
.acts{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;transition:.25s;background:transparent;color:var(--text);cursor:pointer;font-family:var(--sans)}
.btn:hover{border-color:var(--accent);background:rgba(255,255,255,.04)}
.hero{padding:110px 0 70px;text-align:center;background:radial-gradient(ellipse 60% 50% at 50% 30%,rgba(150,160,178,.10),transparent 70%)}
.hero .mark{height:150px;width:auto;margin:0 auto 30px}
h1{font-size:clamp(40px,8vw,76px);margin-top:14px}
.lead{color:var(--mute);max-width:560px;margin:18px auto 0;font-size:17px}
.stamp{display:inline-block;margin-top:30px;padding:8px 18px;border:1px solid var(--line);border-radius:999px;font-size:10px;letter-spacing:.34em;color:var(--mute);text-transform:uppercase}

.envelope{padding:10px 0 90px}
.env-stage{position:relative;width:min(560px,100%);height:min(78vh,640px);min-height:420px;margin-inline:auto}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:500 11px/1.6 var(--serif);letter-spacing:.42em;text-transform:uppercase;color:#8c8f98;opacity:.7;pointer-events:none}
footer{border-top:1px solid #121214;padding:34px 0 44px;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
@media (max-width:640px){.hero{padding:80px 0 50px}.btn{padding:9px 13px;font-size:10px;letter-spacing:.14em}}
@media (max-width:360px){.brand span{display:none}}
</style>

    var a=Math.max(0,Math.min(1,fe/.2))*.93;
    if(a<=0)continue;
    var t=Math.max(0,Math.min(1,fe/.85)),i=(y*CW+x)*4,jn=(rn()-.5)*5;
    D[i]=94-t*60+jn;D[i+1]=15-t*12;D[i+2]=13-t*9;D[i+3]=a*255;
  }
  bg.putImageData(img,0,0);
  /* splatter droplets, radial and matte */
  var dr=mb(33);
  [[820,120,80],[300,430,64],[980,330,52],[560,44,40]].forEach(function(c){
    for(var i=0;i<26;i++){var ang=dr()*6.283,r=Math.pow(dr(),1.6)*c[2],px=c[0]+Math.cos(ang)*r*1.5,py=c[1]+Math.sin(ang)*r,sz=.7+dr()*dr()*5.5;
      bg.fillStyle='rgba('+(62+dr()*30|0)+',5,7,'+(.72+dr()*.26)+')';
      bg.save();bg.translate(px,py);bg.rotate(Math.atan2(py-c[1],px-c[0]));bg.beginPath();bg.ellipse(0,0,sz*(1+r/c[2]*.9),sz,0,0,7);bg.fill();bg.restore();}});
}
function drawLetter(){
  var g=lc.getContext('2d');g.globalCompositeOperation='source-over';g.clearRect(0,0,CW,CH);
  g.drawImage(paperC,0,0);
  g.textAlign='center';g.textBaseline='middle';
  g.font='italic 500 112px "Cormorant Garamond",Georgia,"Times New Roman",serif';
  g.fillStyle='#cdc4ae';
  g.fillText('Did you really believe',600,200);
  g.fillText('it would be that easy?',600,334);
  /* worn, flaking ink */
  var rn=mb(5);g.fillStyle='rgba(16,12,10,.8)';
  for(var i=0;i<1700;i++){g.beginPath();g.arc(70+rn()*1060,100+rn()*340,.6+rn()*2,0,7);g.fill();}
  g.drawImage(bloodC,0,0);
  g.globalCompositeOperation='destination-in';g.drawImage(maskC,0,0);g.globalCompositeOperation='source-over';
  lt.needsUpdate=true;
}
buildPaper();buildBlood();drawLetter();
if(document.fonts&&document.fonts.load){document.fonts.load('italic 500 112px "Cormorant Garamond"').then(drawLetter).catch(function(){});}
var letter=new THREE.Mesh(new THREE.PlaneGeometry(LW,LH),new THREE.MeshStandardMaterial({map:lt,emissiveMap:lt,emissive:0xffffff,emissiveIntensity:.3,roughness:.9,metalness:0,alphaTest:.5,side:THREE.DoubleSide}));
grp.add(letter);
/* soft shadow under the letter */
var sc=document.createElement('canvas');sc.width=sc.height=128;var sg=sc.getContext('2d'),gr=sg.createRadialGradient(64,64,10,64,64,64);
gr.addColorStop(0,'rgba(0,0,0,.7)');gr.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=gr;sg.fillRect(0,0,128,128);
var shadow=new THREE.Mesh(new THREE.PlaneGeometry(LW*1.25,LH*1.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
shadow.position.set(.1,-.2,-.02);letter.add(shadow);



/* framing */
var WZ=2.4,WY=.15,fs=1.8;
function fit(){
  var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  R.setSize(w,h,false);cam.aspect=w/h;
  var t=Math.tan(cam.fov*Math.PI/360),a=w/h;
  var d=Math.max((5.95/2)/t,(5.5/2)/(t*a));
  cam.position.set(0,0,d);cam.updateProjectionMatrix();
  var visW=2*(d-WZ)*t*a,visH=2*(d-WZ)*t;
  fs=Math.min(1.9,.88*visW/LW,.55*visH/LH);
}
if(window.ResizeObserver){new ResizeObserver(fit).observe(stage);}else{addEventListener('resize',fit);}
fit();

/* animation: prog 0 = letter inside, 1 = letter presented */
function cl(v){return Math.max(0,Math.min(1,v));}
function eo(t){return 1-Math.pow(1-t,3);}
function eio(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function lerp(a,b,t){return a+(b-a)*t;}
var prog=0,goal=0;
function pose(){
  var p1=eo(cl(prog/.45)),p2=eio(cl((prog-.35)/.65));
  var yA=lerp(-.88,1.5,p1),yT=WY-grp.position.y;
  letter.position.set(0,lerp(yA,yT,p2),lerp(.014,WZ,p2));
  letter.scale.setScalar(lerp(1,fs,p2));
  letter.rotation.set(0,0,Math.sin(p2*Math.PI)*.08);
}

/* interaction */
var yaw=-.25,pitch=.08,ty=0,tp=.08,drag=null,touched=false,lastTap=0,lx=0,ly=0,open=false;
function toggle(){
  open=!open;goal=open?1:0;
  if(open){ty=0;tp=0;}
  hint.textContent=open?'Double tap to close':'Double tap to open';
}
el.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false};try{el.setPointerCapture(e.pointerId);}catch(_){}});
el.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;
  if(drag.moved&&!open){touched=true;ty=Math.max(-.7,Math.min(.7,ty+(e.clientX-drag.x)*.006));tp=Math.max(-.4,Math.min(.45,tp+(e.clientY-drag.y)*.004));}
  drag.x=e.clientX;drag.y=e.clientY;});
el.addEventListener('pointerup',function(e){
  if(drag&&!drag.moved){
    var n=performance.now();
    if(n-lastTap<340&&Math.hypot(e.clientX-lx,e.clientY-ly)<40){toggle();lastTap=0;}
    else{lastTap=n;lx=e.clientX;ly=e.clientY;}
  }
  drag=null;});
el.addEventListener('pointercancel',function(){drag=null;});
el.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){toggle();e.preventDefault();}});

var last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(.05,(now-last)/1000);last=now;
  var sway=(open||touched)?0:Math.sin(now/1700)*.1;
  yaw+=(ty+sway-yaw)*.07;pitch+=(tp-pitch)*.07;
  grp.rotation.set(pitch,yaw,0);
  if(prog!==goal){var s=dt/2.2;prog=goal>prog?Math.min(goal,prog+s):Math.max(goal,prog-s);}
  pose();
  R.render(scene,cam);
}
requestAnimationFrame(loop);
})();

</script>
<script>
document.getElementById('lockBtn').addEventListener('click',function(){
  try{sessionStorage.removeItem('vr_unlocked');}catch(e){}
  location.href='index.html';
});
</script>
